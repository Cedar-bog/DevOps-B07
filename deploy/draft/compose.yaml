services:
  draft:
    image: b07-draft:${IMAGE_TAG}
    container_name: b07-draft
    restart: unless-stopped
    entrypoint: [ "python", "-m", "draft.api" ]
    command: [ "--host", "0.0.0.0", "--port", "8080", "--data-dir", "/data" ]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-./data}:/data
    environment:
      DRAFT_DATA_DIR: /data
      DRAFT_DOCKER: docker
    user: "0:0"
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
