name: E7 Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e7-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: e7-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Prepare evidence directory
        run: |
          RUN_DIR="work/ci/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUN_DIR"
          echo "EVIDENCE_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUN_DIR/commit.txt"
          echo "python scripts/run_e7_gate.py" > "$RUN_DIR/command.txt"
          {
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "python=$(python --version 2>&1)"
            echo "pip=$(python -m pip --version 2>&1)"
          } > "$RUN_DIR/env.txt"
          python -m pip freeze >> "$RUN_DIR/env.txt"

      - name: Check Python syntax
        run: python -m compileall -q services/draft/draft services/draft/tests scripts

      - name: Run E7 gate
        run: |
          set -o pipefail
          PYTEST_ADDOPTS="--junitxml=${EVIDENCE_DIR}/junit.xml" \
            python scripts/run_e7_gate.py 2>&1 | tee "${EVIDENCE_DIR}/gate.log"
          code=$?
          echo "GATE_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit "$code"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## E7 Quality Gate"
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- event: \`${GITHUB_EVENT_NAME}\`"
            echo "- gate exit code: \`${GATE_EXIT_CODE:-not-run}\`"
            echo "- evidence: \`${EVIDENCE_DIR:-not-created}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E7 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e7-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/ci/
          if-no-files-found: warn
          retention-days: 14
