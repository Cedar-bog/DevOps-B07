name: E8-E10 Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e8e10-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: e8e10-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Prepare evidence directory
        run: |
          RUN_DIR="work/ci/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUN_DIR"
          echo "EVIDENCE_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUN_DIR/commit.txt"
          {
            echo "python -m pytest services/md-fixer/tests -q"
            echo "python scripts/run_e10_gate.py --out $RUN_DIR/e10"
          } > "$RUN_DIR/command.txt"
          {
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "python=$(python --version 2>&1)"
            echo "pip=$(python -m pip --version 2>&1)"
            echo "git=$(git --version 2>&1)"
            echo "make=$(make --version 2>&1 | head -n 1 || true)"
            echo "gcc=$(gcc --version 2>&1 | head -n 1 || true)"
          } > "$RUN_DIR/env.txt"
          python -m pip freeze >> "$RUN_DIR/env.txt"

      - name: Check Python syntax
        run: python -m compileall -q services/md-fixer/mdfixer services/md-fixer/tests scripts

      - name: Run MDFixer tests
        run: |
          set -o pipefail
          set +e
          PYTEST_ADDOPTS="--junitxml=${EVIDENCE_DIR}/junit.xml" \
            python -m pytest services/md-fixer/tests -q 2>&1 | tee "${EVIDENCE_DIR}/test.log"
          code=${PIPESTATUS[0]}
          echo "TEST_EXIT_CODE=$code" >> "$GITHUB_ENV"
          set -e
          exit "$code"

      - name: Run E10 gate
        run: |
          set -o pipefail
          set +e
          python scripts/run_e10_gate.py --out "${EVIDENCE_DIR}/e10" 2>&1 | tee "${EVIDENCE_DIR}/e10-gate.log"
          code=${PIPESTATUS[0]}
          echo "E10_GATE_EXIT_CODE=$code" >> "$GITHUB_ENV"
          set -e
          exit "$code"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## E8-E10 Quality Gate"
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- event: \`${GITHUB_EVENT_NAME}\`"
            echo "- MDFixer tests exit code: \`${TEST_EXIT_CODE:-not-run}\`"
            echo "- E10 gate exit code: \`${E10_GATE_EXIT_CODE:-not-run}\`"
            echo "- evidence: \`${EVIDENCE_DIR:-not-created}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e8e10-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/ci/
          if-no-files-found: warn
          retention-days: 14
